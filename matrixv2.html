<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Digital Rain</title>
    <style>
        /* Reset and layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a0000;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Canvas occupies the full screen background */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Centered Text Overlay */
        .overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(0, 255, 70, 0.6), 0 0 20px rgba(0, 255, 70, 0.4);
            pointer-events: none; /* Allows clicks to pass through if needed */
            user-select: none;
        }

        .overlay h1 {
            font-size: 3rem;
            letter-spacing: 8px;
            margin-bottom: 10px;
            text-transform: uppercase;
            animation: pulse 3s ease-in-out infinite;
        }

        .overlay p {
            font-size: 1.2rem;
            letter-spacing: 4px;
            color: #88ff88;
            opacity: 0.8;
        }

        /* Subtle pulsing effect for the overlay text */
        @keyframes pulse {
            0%, 100% { transform: scale(1); text-shadow: 0 0 8px rgba(0, 255, 70, 0.6); }
            50% { transform: scale(1.02); text-shadow: 0 0 15px rgba(0, 255, 70, 0.9), 0 0 30px rgba(0, 255, 70, 0.4); }
        }
    </style>
</head>
<body>

    <canvas id="matrixCanvas"></canvas>

    <div class="overlay">
        <h1>Its all real</h1>
        <p>Here in the Matrix</p>
    </div>

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.bind ? canvas.getContext('2d') : canvas.getContext('2d');

        // Set full screen dimensions
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Matrix characters (Katakana, Latin alphabets, and numbers)
        const matrixChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ Nishiki ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ1234567890:+-*<>|";
        const alphabet = matrixChars.split("");

        const fontSize = 16;
        // Calculate columns based on width and font size
        let columns = Math.floor(canvas.width / fontSize);

        // Array to track the y-coordinate of the falling stream for each column
        let rainDrops = [];
        for (let x = 0; x < columns; x++) {
            // Randomize starting positions above the screen so they don't fall in a perfect line
            rainDrops[x] = Math.random() * -100; 
        }

        function draw() {
            // Semi-transparent black background to create the trailing/fading effect
            ctx.fillStyle = 'rgba(26, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            // Loop through each column
            for (let i = 0; i < rainDrops.length; i++) {
                // Pick a random character
                const text = alphabet[Math.floor(Math.random() * alphabet.length)];
                const xPos = i * fontSize;
                const yPos = rainDrops[i] * fontSize;

                // Check if this character is the "head" (the leading character at the bottom of the stream)
                // We peek ahead to see if the next frame would start a brand new drop or if it's the current front.
                // Alternatively, drawing a bright white character right at the current yPos position:
                
                // Base trail style (dimmer greens)
                ctx.fillStyle = '#0F0'; 
                ctx.shadowBlur = 0; // Clear shadow for trail to keep performance high

                // Glowing Head Character Logic:
                // If it's the very front character of the drop, make it bright white with a strong glow
                if (Math.random() > 0.98 || yPos > 0) {
                    // We can simulate the leading character by checking if the drop is just active
                    // Let's make the immediate character being drawn white if it's the leading edge
                    ctx.fillStyle = '#FFF';
                    ctx.shadowColor = '#0F0';
                    ctx.shadowBlur = 8;
                }

                ctx.fillText(text, xPos, yPos);

                // Reset drop to the top with a random delay once it goes past the screen edge
                if (yPos > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }

                // Move the drop down the screen
                rainDrops[i]++;
            }
        }

        // Keep updating columns array if screen resizes dynamically
        window.addEventListener('resize', () => {
            const oldColumns = columns;
            columns = Math.floor(canvas.width / fontSize);
            if (columns > oldColumns) {
                for (let i = oldColumns; i < columns; i++) {
                    rainDrops[i] = Math.random() * -100;
                }
            }
        });

        // Run the loop at roughly 30 frames per second
        setInterval(draw, 33);
    </script>
</body>
</html>
